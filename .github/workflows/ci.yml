name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck · lint · assets · features · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Asset references exist on disk
        run: npm run check:assets

      - name: Image history preserved (nothing overwritten without an archived copy)
        run: |
          git fetch --depth=1 origin main
          IMAGE_GUARD_BASE=FETCH_HEAD npm run verify:images

      - name: Feature verification (prompt models, 30 styles, undo/redo)
        run: npm run verify:features

      - name: Rapture canon, assets, prompts and persistence
        run: npm run verify:rapture

      - name: Shared sound-effect library (NEONOIRE, Hangar, Rapture)
        run: npm run verify:sfx

      - name: Production build
        run: npm run build
